[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatcap"
version = "0.1.0"
description = "Capture YouTube live chat and comments"
requires-python = ">=3.10"
dependencies = [
    "python-dateutil",
    "rich",
    "textual",
    "yt-chat-downloader",
    "yt-dlp",
]

[project.scripts]
chatcap = "chatcap.cli:main"

[project.optional-dependencies]
test = ["pytest", "pytest-mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["chatcap"]
